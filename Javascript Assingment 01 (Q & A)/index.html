<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMIT Batch 22 - JavaScript Assignment 01</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background: #ffffff;
        width: 100%;
        max-width: 550px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .badge {
        background-color: #4a90e2;
        color: white;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: bold;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      h1 {
        color: #2c3e50;
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        font-size: 15px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .instructions-box {
        background: #f8f9fa;
        border-left: 4px solid #4a90e2;
        padding: 15px;
        text-align: left;
        border-radius: 4px;
        font-size: 14px;
        color: #444;
      }
      code {
        background: #e9ecef;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        color: #d63384;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">SMIT Batch 22</span>
      <h1>JavaScript Assignment 01</h1>
      <p>Fundamentals & Basic Problem Solving[cite: 1]</p>

      <div class="instructions-box">
        <strong>How to view outputs:</strong><br />
        Press <code>F12</code> or <code>Ctrl + Shift + I</code> on your keyboard
        and open the <strong>Console</strong> tab to see all your answers and
        run through the prompts!
      </div>
    </div>

    <!-- Links your combined JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
